<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumi — World of Fables | Educational app for kids</title>
  <meta name="description" content="Lumi — World of Fables is an educational app for children: explore the map, rebuild fairy tales, and unlock chapters in the storybook." />
  <meta property="og:title" content="Lumi — World of Fables" />
  <meta property="og:description" content="An interactive adventure to rebuild fairy tales, one scene at a time." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="images/lumi-say-hi.png" />

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png?v=3" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top-bar">
    <div class="container top-bar-inner">
      <a class="brand" href="index.html" aria-label="Lumi — Home">
        <div class="brand-icon">
          <img src="images/app-icon-default.png?v=3" alt="" width="62" height="62" />
        </div>
        <span>Lumi</span>
      </a>

    </div>
  </header>

  <main>
    <section class="hero-wrap" aria-label="Home">
      <div class="container page">
        <div class="content" aria-label="Lumi introduction">

          <h1 class="app-title app-title--center" aria-label="Lumi World Of Fables">
            <span class="app-title-line app-title-line1">
              <span class="app-title-stroke" aria-hidden="true">Lumi</span>
              <span class="app-title-fill">Lumi</span>
            </span>
            <span class="app-title-line app-title-line2">
              <span class="app-title-stroke" aria-hidden="true">World Of Fables</span>
              <span class="app-title-fill">World Of Fables</span>
            </span>
          </h1>

          <p class="subtitle">
            An interactive adventure to rebuild fairy tales, one scene at a time.
          </p>

          <a
            class="game-btn game-btn-primary"
            href="regole.html"
          >
            <span class="game-pill-bg">
              <span class="game-pill">Start the adventure!</span>
            </span>
          </a>

          <nav class="small-buttons" aria-label="Other pages">
            <a class="game-btn" href="privacy.html">
              <span class="game-pill-bg"><span class="game-pill">Privacy &amp; Policy</span></span>
            </a>
            <a class="game-btn" href="chi-siamo.html">
              <span class="game-pill-bg"><span class="game-pill">About Us</span></span>
            </a>
          </nav>
        </div>

        <div class="hero-mascot-wrap" aria-label="Lumi character">
          <button type="button" class="hero-mascot-btn" aria-label="Tap Lumi to jump">
            <img
              class="hero-mascot"
              src="images/lumi-say-hi.png"
              alt="Lumi waving hello"
              width="400"
              height="647"
              loading="eager"
            />
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottom-bar">
    <div class="container bottom-bar-inner">
      <p><strong>© 2026 Lumi: World Of Fables</strong></p>
      <p>Optimized for iPadOS</p>
    </div>
  </footer>

  <script>
    document.querySelector(".hero-mascot-btn")?.addEventListener("click", (event) => {
      const mascot = event.currentTarget.querySelector(".hero-mascot");
      if (!mascot || mascot.classList.contains("hero-mascot--jump")) return;

      mascot.classList.add("hero-mascot--jump");
      mascot.addEventListener(
        "animationend",
        () => mascot.classList.remove("hero-mascot--jump"),
        { once: true }
      );
    });
  </script>

</body>
</html>
